
name: GitHub Projects Status to Discord

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: project-status-discord
  cancel-in-progress: false

jobs:
  check-project-status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore previous status
        uses: actions/cache/restore@v4
        with:
          path: .github/project-status-state.json
          key: project-status-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            project-status-

      - name: Check Project status and notify Discord
        uses: actions/github-script@v7
        env:
          GH_PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const fs = require('fs');

            const token = process.env.GH_PROJECT_TOKEN;
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            const stateFile = '.github/project-status-state.json';

            if (!token || !webhook) {
              throw new Error('GitHub token atau Discord webhook belum tersedia.');
            }

            async function graphql(query, variables) {
              const response = await fetch(
                'https://api.github.com/graphql',
                {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${token}`,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({ query, variables })
                }
              );

              const result = await response.json();

              if (!response.ok || result.errors) {
                throw new Error(JSON.stringify(result.errors || result));
              }

              return result.data;
            }

            const query = `
              query($login: String!, $number: Int!, $after: String) {
                user(login: $login) {
                  projectV2(number: $number) {
                    items(first: 100, after: $after) {
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                      nodes {
                        id
                        content {
                          ... on DraftIssue { title }
                          ... on Issue { title }
                          ... on PullRequest { title }
                        }
                        fieldValues(first: 50) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field {
                                ... on ProjectV2SingleSelectField {
                                  name
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const current = {};
            let cursor = null;
            let projectFound = false;

            do {
              const data = await graphql(query, {
                login: 'arielibnu',
                number: 2,
                after: cursor
              });

              const project = data.user?.projectV2;

              if (!project) {
                throw new Error('Personal Project nomor 2 tidak ditemukan.');
              }

              projectFound = true;

              const connection = project.items;

              for (const item of connection.nodes) {
                const statusField = item.fieldValues.nodes.find(
                  field => field.field?.name === 'Status'
                );

                current[item.id] = {
                  title: item.content?.title || 'Draft task',
                  status: statusField?.name || 'Belum diatur'
                };
              }

              cursor = connection.pageInfo.endCursor;

              if (!connection.pageInfo.hasNextPage) break;

            } while (true);

            const previous = fs.existsSync(stateFile)
              ? JSON.parse(fs.readFileSync(stateFile, 'utf8'))
              : null;

            if (!previous) {
              fs.mkdirSync('.github', { recursive: true });
              fs.writeFileSync(stateFile, JSON.stringify(current, null, 2));
              console.log('Baseline awal berhasil disimpan. Belum mengirim notifikasi.');
              return;
            }

            let changes = 0;

            for (const [id, task] of Object.entries(current)) {
              const oldTask = previous[id];

              if (oldTask && oldTask.status !== task.status) {
                const message = [
                  '📋 **PERUBAHAN STATUS TUGAS**',
                  '',
                  `📝 Tugas: ${task.title}`,
                  `🔄 Status: ${oldTask.status} → ${task.status}`,
                  '',
                  '🔗 https://github.com/users/arielibnu/projects/2'
                ].join('\n');

                const response = await fetch(webhook, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ content: message })
                });

                if (!response.ok) {
                  throw new Error('Discord gagal menerima notifikasi: ' + response.status);
                }

                changes++;
              }
            }

            fs.mkdirSync('.github', { recursive: true });
            fs.writeFileSync(stateFile, JSON.stringify(current, null, 2));

            console.log(`Pemeriksaan selesai. Perubahan status: ${changes}`);
            console.log(`Project ditemukan: ${projectFound}`);

      - name: Save latest status
        uses: actions/cache/save@v4
        with:
          path: .github/project-status-state.json
          key: project-status-${{ github.run_id }}-${{ github.run_attempt }}
